model:
  input_size: 8  # sst, tair, tsfc, sss, hi, hs, sice, frzmlt
  hidden_size: 16
  output_size: 1  # aice (ice concentration)

domain:
  pole: "both"           # "north", "south", or "both"
  clean_data: true       # Apply strict quality filters

data:
  data_path: "data/sample_data.npz"
  validation_split: 0.1
  num_workers: 0
  num_samples: 1000000

training:
  epochs: 500
  batch_size: 5000       # Increased for better GPU utilization
  optimizer:
    type: "adam"
    learning_rate: 0.001
    weight_decay: 0.00001
  scheduler: null  # Disabled - using constant learning rate
  loss_function: "mse"
  early_stopping_patience: 100
  log_interval: 50
  save_interval: 20
  # Jacobian convergence tracking (for data assimilation)
  jacobian_freq: 5      # Compute Jacobian metrics every N epochs
  track_jacobian: true  # Enable/disable Jacobian tracking
  # Advanced stopping criteria
  convergence_tolerance: 0.00000001    # Relative loss change threshold
  convergence_window: 5          # Number of epochs to check convergence
  min_epochs: 400                 # Minimum epochs before early stopping
  # Jacobian-based stopping criteria
  use_jacobian_stopping: true         # Enable Jacobian convergence stopping
  jacobian_convergence_tolerance: 0.0001  # Relative change in Jacobian metrics
  jacobian_convergence_window: 5      # Number of Jacobian evaluations for convergence
  min_epochs_jacobian: 30             # Minimum epochs before Jacobian stopping

output:
  model_dir: "models/"

use_cuda: true
